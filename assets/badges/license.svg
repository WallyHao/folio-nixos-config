<svg xmlns="http://www.w3.org/2000/svg" width="88" height="24" viewBox="0 0 88 24" role="img" aria-labelledby="license-title">
  <title id="license-title">许可证: MIT</title>
  <defs>
    <clipPath id="license-badge">
      <rect width="88" height="24" rx="4"/>
    </clipPath>
  </defs>
  <g clip-path="url(#license-badge)">
    <rect width="88" height="24" fill="#2d353b"/>
    <rect x="50" width="38" height="24" fill="#d3c6aa"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
    <text x="25" y="16" fill="#e4ddc7">许可证</text>
    <text x="69" y="16" fill="#1b2521" font-weight="600">MIT</text>
  </g>
</svg>
