// Folio: keep browser windows independent of Zen workspace replication.
(() => {
  let ready = false;
  Services.obs.addObserver(document => {
    const win = document.defaultView?.wrappedJSObject;
    if (!ready || !win || document.documentURI !== "chrome://browser/content/browser.xhtml") {
      return;
    }
    document.documentElement.setAttribute("zen-unsynced-window", "true");
    win._zenStartupSyncFlag = "unsynced";
  }, "document-element-inserted");
  Services.obs.addObserver(subject => {
    const win = subject.wrappedJSObject;
    ready = true;
    // Zen finishes workspace restoration after Gecko's session-restored event.
    // Adopt restored tabs only after Zen's own startup promise has resolved.
    // New tabs are handled by the signed extension.
    win.gZenStartup.promiseInitialized.then(() => {
      if (win.closed || !win.gBrowser) return;
      const tabs = Array.from(win.gBrowser.tabs).filter(tab =>
        !tab.hasAttribute("zen-empty-tab") && !tab.closing);
      for (const tab of tabs.slice(1)) {
        if (tab.isConnected && tab.ownerDocument === win.document) {
          win.gBrowser.replaceTabWithWindow(tab);
        }
      }
    }).catch(error => Cu.reportError(error));
  }, "browser-delayed-startup-finished");
})();
