target-version = "py311"
line-length = 100

[lint]
# Correctness checks alongside the formatter; generated guest scripts below
# receive their execution namespace from the NixOS test driver.
select = ["E9", "F63", "F7", "F82"]

[lint.per-file-ignores]
"modules/manager/tests/recovery.py" = ["F821"]
"modules/manager/tests/release.py" = ["F821"]
"modules/network/tests/acceptance.py" = ["F821"]
